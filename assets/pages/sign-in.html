<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
  </head>
  <body>
    <section class="sign-in">
      <div class="container">
        <div class="sign-in-wrapper">
          <div class="left">
            <div class="language-wrapper">
              <div class="lang-dropdown" id="langDropdown">
                <button
                  class="lang-btn"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="lang-current">Ru</span>
                  <svg
                    class="lang-arrow"
                    width="12"
                    height="8"
                    viewBox="0 0 12 8"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M1 1.5L6 6.5L11 1.5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <ul class="lang-menu" role="listbox">
                  <li class="lang-option active" data-value="Ru" role="option">
                    Ru
                  </li>
                  <li class="lang-option" data-value="En" role="option">En</li>
                  <li class="lang-option" data-value="Uz" role="option">Uz</li>
                </ul>
              </div>
            </div>

            <div class="form-wrapper">
              <div class="form-header">
                <img src="/assets/images/Logo.png" alt="image" />
                <h1>Добро пожаловать!</h1>
                <p>Войдите, чтобы продолжить</p>
              </div>

              <div class="form-body">
                <div class="auth-tabs">
                  <div class="tabs-header">
                    <button type="button" class="tab-btn active" data-tab="sms">
                      По SMS
                    </button>
                    <button type="button" class="tab-btn" data-tab="password">
                      По паролю
                    </button>
                  </div>

                  <div class="tabs-content">
                    <div class="tab-pane active" id="tab-sms">
                      <form class="auth-form">
                        <div class="input-group">
                          <label for="sms-phone">Телефон</label>
                          <input
                            type="tel"
                            id="sms-phone"
                            placeholder="+998 (00) 000 - 00 - 00"
                            required
                          />
                        </div>

                        <button type="submit" class="submit-btn default-btn">
                          Отправить SMS
                        </button>

                        <div class="form-footer">
                          <span>Нет аккаунта ?</span>
                          <a href="#" class="link">Зарегистрироваться</a>
                        </div>
                      </form>
                    </div>

                    <div class="tab-pane" id="tab-password">
                      <form class="auth-form">
                        <div class="input-group">
                          <label for="pass-phone">Телефон</label>
                          <input
                            type="tel"
                            id="pass-phone"
                            placeholder="+998 (00) 000 - 00 - 00"
                            required
                          />
                        </div>

                        <div class="input-group">
                          <label for="pass-password">Пароль</label>
                          <div class="password-wrapper">
                            <input
                              type="password"
                              id="pass-password"
                              placeholder="••••••"
                              required
                            />
                            <button
                              type="button"
                              class="toggle-password"
                              aria-label="Показать пароль"
                            >
                              <svg
                                width="18"
                                height="12"
                                viewBox="0 0 18 12"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                              >
                                <path
                                  d="M1 6S4 1 9 1s8 5 8 5-3 5-8 5-8-5-8-5z"
                                  stroke="currentColor"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                />
                                <circle
                                  cx="9"
                                  cy="6"
                                  r="2"
                                  stroke="currentColor"
                                  stroke-width="1.5"
                                />
                              </svg>
                            </button>
                          </div>
                          <div class="forgot-wrapper">
                            <a href="#" class="forgot-link">Забыли пароль ?</a>
                          </div>
                        </div>

                        <button type="submit" class="submit-btn primary-btn">
                          Войти
                        </button>

                        <div class="form-footer">
                          <span>Нет аккаунта ?</span>
                          <a href="#" class="link">Зарегистрироваться</a>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="left-footer-wrapper">
              <p>© 2026 STAREX. Все права защищены.</p>
            </div>
          </div>

          <div class="right">
            <img src="/assets/images/sign-in/banner.jpg" alt="image" />
          </div>
        </div>
      </div>
    </section>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
