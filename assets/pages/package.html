<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Посылка</title>

    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
  </head>

  <body class="profile-page-body">
    <header>
      <div class="container">
        <div class="nav profile-nav">
          <!-- LOGO -->
          <div class="logo-wrapper">
            <a href="/index.html">
              <img src="/assets/images/Logo.png" alt="Starex" />
            </a>
          </div>

          <!-- DESKTOP / MOBILE NAV -->
          <div class="mobile-menu-wrapper" id="mobileMenu">
            <!-- NAV MENU -->
            <div class="nav-menu-wrapper">
              <ul>
                <li>
                  <a href="/index.html">
                    <svg
                      class="nav-icon"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                      />
                    </svg>

                    <span>Главная</span>
                  </a>
                </li>

                <li>
                  <a href="/assets/pages/package.html">
                    <svg
                      class="nav-icon"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
                      />
                    </svg>

                    <span>Посылки</span>
                  </a>
                </li>

                <li>
                  <a href="/assets/pages/filials.html">
                    <svg
                      class="nav-icon"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
                      />

                      <circle cx="12" cy="10" r="3" />
                    </svg>

                    <span>Офисы</span>
                  </a>
                </li>

                <li>
                  <a href="/assets/pages/chat.html">
                    <svg
                      class="nav-icon"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                      />
                    </svg>

                    <span>Чат</span>
                  </a>
                </li>
              </ul>
            </div>

            <!-- RIGHT NAV -->
            <div class="right-nav-menu-wrapper">
              <!-- PROFILE -->
              <div class="profile-wrapper">
                <div class="user-icon">
                  <img src="/assets/images/home/user.svg" alt="user" />
                </div>

                <a href="/assets/pages/profile.html">Timur</a>
              </div>

              <!-- LANGUAGE -->
              <div class="language-wrapper">
                <div class="lang-dropdown" id="langDropdown">
                  <button
                    class="lang-btn"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                  >
                    <span class="lang-current">Ru</span>

                    <svg
                      class="lang-arrow"
                      width="12"
                      height="8"
                      viewBox="0 0 12 8"
                      fill="none"
                    >
                      <path
                        d="M1 1.5L6 6.5L11 1.5"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>

                  <ul class="lang-menu" role="listbox">
                    <li class="lang-option active" data-value="Ru">Ru</li>

                    <li class="lang-option" data-value="En">En</li>

                    <li class="lang-option" data-value="Uz">Uz</li>
                  </ul>
                </div>
              </div>

              <!-- EXIT -->
              <a href="/assets/pages/sign-in.html" class="exit-wrapper">
                <img src="/assets/images/home/exit.svg" alt="Выйти" />
              </a>
            </div>
          </div>

          <!-- BURGER -->
          <button
            class="burger-btn"
            id="burgerBtn"
            aria-label="Открыть меню"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="pack-container">
        <div class="container">
          <div class="pack-wrapper">
            <div class="pack-header-wrapper">
              <h1>Посылки</h1>
            </div>

            <div class="track-wrapper">
              <div class="track-icon">
                <img src="/assets/images/home/search.svg" alt="image" />
                <p>Отследить посылку</p>
              </div>

              <form>
                <div class="form-item">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Введите трекинг номер"
                  />
                  <button class="btn-track">Наблюдать</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="profile-sidebar-overlay" id="profileSidebarOverlay"></div>
    <script src="/assets/js/imask.js"></script>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
